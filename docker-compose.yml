services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hosteldb
      MYSQL_USER: hostel
      MYSQL_PASSWORD: hostelpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports: ["3307:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hosteldb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: hostel
      DB_PASSWORD: hostelpass
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DDL_AUTO: update
    ports: ["8080:8080"]
volumes:
  mysql_data:
